---
layout: default
title: 我的博客
---

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      margin: 1rem;
      text-align: center;
    }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #4CAF50;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      margin: 2rem 0;
      color: #888;
    }
    .post-list li {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
  </header>

  <nav>
    <a href="{{ "/" | relative_url }}">首页</a>
    <a href="{{ "/about.html" | relative_url }}">关于我</a>
    <a href="{{ "/contact.html" | relative_url }}">联系</a>
  </nav>

  <main>
    <h2>文章列表</h2>
    <ul class="post-list">
      {% for post in site.posts %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          - {{ post.date | date: "%Y-%m-%d" }}
        </li>
      {% endfor %}
    </ul>
  </main>

  <footer>
    &copy; {{ site.time | date: "%Y" }} wuyijing55-lab
  </footer>
</body>
</html>
